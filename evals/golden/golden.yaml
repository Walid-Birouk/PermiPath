      - "Le VLS-TS « étudiant » ne permet de séjourner au-delà de 3 mois qu'à la condition que son titulaire déclare, dans les 3 mois suivant son entrée, la date d'entrée et son domicile au moyen d'un téléservice (article R431-17)."
