# Indexed sources and their metadata. Read by `python -m ingestion run`.
#
# Status: DRAFT, pending maintainer review. Nothing is embedded until `reviewed_by` and
# `reviewed_at` are set.
#
# Journey stages: arriving | renewing | working | finishing | job_offer | settling
# (CLAUDE.md, Scope).
# Legal articles are not listed here: they are the CESEDA articles cited by the sheets below,
# and each inherits the journey stages of the sheets that cite it.

version: 1
reviewed_by: Walid
reviewed_at: 2026-11-27

fact_sheets:
  # Service-Public.gouv.fr / DILA, Licence Ouverte 2.0. Feed schema 3.5.
  feed_url: https://lecomarquage.service-public.gouv.fr/vdd/3.5/part/zip/vosdroits-latest.zip
  sheets:
    # --- Arriving / renewing ------------------------------------------------------------
    - id: F2231
      title: "Étudiant étranger en France : visa de long séjour ou titre de séjour"
      journey_stages: [arriving, renewing]
    - id: F35796
      title: 'Carte de séjour étudiant "programme de mobilité"'
      journey_stages: [arriving, renewing]
    - id: F39
      title: "Quels titres de séjour un ressortissant étranger doit-il avoir pour rester en France plus de 3 mois ?"
      journey_stages: [arriving]
    - id: F35799
      title: "Carte de séjour pluriannuelle"
      journey_stages: [renewing]
    - id: F15763
      title: "Qu'est-ce qu'un récépissé de demande de titre de séjour ?"
      journey_stages: [renewing]
    - id: F36206
      title: "Qu'est-ce qu'une attestation de demande de carte de séjour ?"
      journey_stages: [renewing]
    - id: F31969
      title: "Que faire en cas de difficulté lors d'une demande de titre de séjour ?"
      journey_stages: [renewing]
      note: Mostly orientation (contacts, remedies); useful for handoff answers.
    # --- Working while studying ---------------------------------------------------------
    - id: F2713
      title: "Un étudiant non européen peut-il travailler en France ?"
      journey_stages: [working]
    - id: F17312
      title: "Stagiaire étranger en France : visa de long séjour ou carte de séjour"
      journey_stages: [working]
      note: >-
        Separate "stagiaire" permit (interns coming for an internship), not the internship of
        an enrolled student. Keep only if in scope.
    - id: F16734
      title: "Stage d'un étudiant en milieu professionnel"
      journey_stages: [working]
      note: >-
        Internship of an enrolled student (convention de stage, duration, gratification); states
        that a foreign student may do an internship whatever their nationality, if their stay is
        regular. Added for golden item g008.
    # --- Finishing studies / job offer --------------------------------------------------
    - id: F17319
      title: "Carte de séjour ou VLS-TS - Recherche d'emploi/création d'entreprise"
      journey_stages: [finishing]
    - id: F2229
      title: "Étudiant étranger : comment travailler en France après ses études ?"
      journey_stages: [finishing, job_offer]
    - id: F15898
      title: "Travail d'un étranger en France : carte de séjour - salarié/travailleur temporaire"
      journey_stages: [job_offer]
    - id: F16922
      title: "Carte talent : carte de séjour pluriannuelle d'un étranger en France"
      journey_stages: [job_offer]
      note: Covers every "talent" category; only "salarié qualifié" is in the journey.
    - id: F2728
      title: "Autorisation de travail d'un salarié étranger en France"
      journey_stages: [working, job_offer]
    # --- Algerian nationals -------------------------------------------------------------
    - id: F2215
      title: "Certificat de résidence d'1 an pour Algérien"
      journey_stages: [arriving, renewing, finishing, job_offer]
      nationality_scope: algerian
    - id: F2733
      title: "Autorisation de travail d'un Algérien salarié en France"
      journey_stages: [working, job_offer]
      nationality_scope: algerian
      note: Sheet last modified 2021-04-02 (oldest in this list).
    # --- Settling (long-term residence after the job offer) -------------------------------
    - id: F2257
      title: "Certificat de résidence de 10 ans - Personne de nationalité algérienne"
      journey_stages: [settling]
      nationality_scope: algerian
    # --- EU/EEA students (no residence permit required) --------------------------------
    - id: F22116
      title: "Carte de séjour d'un étudiant européen"
      journey_stages: [arriving]
      note: >-
        Lets the assistant tell EU/EEA students that the non-EU rules do not apply to them.
        The sheet text names EU nationals explicitly; there is no "eu" nationality scope.
    - id: F13519
      title: "Un étudiant européen peut-il travailler en France ?"
      journey_stages: [working]
      note: Same purpose as F22116.
  excluded: []

laws:
  # Légifrance / DILA, Licence Ouverte 2.0. Articles in force on the ingestion date.
  codes:
    - text_id: LEGITEXT000006070158
      label: CESEDA
      title: "Code de l'entrée et du séjour des étrangers et du droit d'asile"
      exclude_articles:
        - LEGIARTI000043472320
      include_articles:
        # VLS-TS: no selected sheet cites these articles; they state the validation rule and
        # what follows from it (golden item g003).
        - article_id: LEGIARTI000051747516
          label: R431-16
          journey_stages: [arriving]
          note: Visas exempting from a residence card; 13° is the student VLS-TS.
        - article_id: LEGIARTI000042806968
          label: R431-17
          journey_stages: [arriving]
          note: The VLS-TS allows a stay beyond 3 months only if declared online within 3 months of entry.
        - article_id: LEGIARTI000051747510
          label: R431-18
          journey_stages: [arriving, renewing]
          note: Staying beyond the visa requires a card and proof of the R431-17 formalities.
      annexes:
        # Annexe 10: supporting documents for each residence permit, a table of 69 rows
        # ("points"). Only the journey rows are indexed, one source per point.
        - article_id: LEGIARTI000043472320
          label: Annexe 10
          points:
            - {point: 1, journey_stages: [job_offer]}        # CST "salarié"
            - {point: 2, journey_stages: [job_offer]}        # CST "travailleur temporaire"
            - {point: 4, journey_stages: [job_offer]}        # talent, salarié qualifié / diplômé
            - {point: 5, journey_stages: [job_offer]}        # talent, jeune entreprise innovante
            - {point: 6, journey_stages: [job_offer]}        # talent, carte bleue européenne
            - {point: 25, journey_stages: [arriving, renewing]}  # "étudiant", "étudiant-programme de mobilité"
            - {point: 26, journey_stages: [finishing]}       # RECE, after a diploma
            - {point: 28, journey_stages: [finishing]}       # RECE, return after studies (L. 422-14)
            - {point: 58, journey_stages: [settling]}        # CR "résident de longue durée-UE"
            - {point: 62, journey_stages: [working]}         # CST "stagiaire"
            - {point: 64, journey_stages: [settling]}        # renewal of CR / CR LD-UE
          note: >-
            Point 27 (RECE for researchers) and the other categories (family, protection,
            humanitarian, other grounds, overseas titles) are not in the journey.
      note: >-
        Annexe 10 is excluded as a whole article (about 250,000 characters in the version in
        force, LEGIARTI000049820920) and indexed row by row through `annexes`.
        Code du travail and Code pénal articles cited by the sheets are not ingested yet.

treaties:
  # Franco-Algerian agreement of 27 December 1968 and amendments, as published in the JORF.
  nationality_scope: algerian
  texts:
    - jorf_cid: JORFTEXT000000694290
      title: "Décret n° 69-243 du 18 mars 1969 (publication de l'accord du 27 décembre 1968)"
      status: pending
      note: >-
        No text in the Légifrance API (scan of the full JO issue only). The wording still in
        force is part of the consolidation below.
    - jorf_cid: JORFTEXT000000333424
      title: "Décret n° 86-320 du 7 mars 1986 (publication du premier avenant)"
      status: pending
      note: Same as above.
    - jorf_cid: JORFTEXT000000551016
      title: "Décret n° 94-1103 du 19 décembre 1994 (publication du deuxième avenant)"
      status: pending
      note: >-
        Not indexed as a raw text: its wording is part of the consolidation below, which
        cites this decree as the official source of the provisions it set.
    - jorf_cid: JORFTEXT000000599731
      title: "Décret n° 2002-1500 du 20 décembre 2002 (publication du troisième avenant)"
      status: pending
      note: >-
        Not indexed as a raw text: its wording is part of the consolidation below, which
        cites this decree as the official source of the provisions it set.
  consolidations:
    # Current text of the agreement and its Protocol, rebuilt from the 1968 text and the three
    # amendments. Indexed once its `status` is `verified` by the maintainer.
    - source_id: accord-franco-algerien-1968
      path: franco-algerian-agreement.yaml

case_law:
  # Légifrance / DILA, Licence Ouverte 2.0. Decisions as published (pseudonymised by Légifrance).
  # Indexed only when a decision settles how the indexed texts apply.
  decisions:
    - id: CETATEXT000053612496
      title: "Conseil d'État, 2ème - 7ème chambres réunies, 02/03/2026, 500835"
      journey_stages: [finishing, job_offer, settling]
      nationality_scope: algerian
      note: >-
        Mentioned in the Lebon tables. Holds that the 1968 agreement governs completely the
        conditions of admission to stay of Algerian nationals, so the CESEDA provisions on the
        residence titles and their conditions of issue do not apply to them (point 3). Source
        for golden items g020 and g022 (talent and job-search cards).
