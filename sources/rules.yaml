    topic: work_limit
    stage: working
    label: {fr: "Activité salariée accessoire autorisée par la carte étudiant", en: "Incidental paid work allowed by the student card"}
    value: "dans la limite de 60 % de la durée de travail annuelle"
    quote: "Cette carte donne droit à l'exercice, à titre accessoire, d'une activité professionnelle salariée dans la limite de 60 % de la durée de travail annuelle."
    source: law:LEGIARTI000042771654
    verified_by: null
    verified_at: null
