# Rules table (build step 5): figures, deadlines, fees and documents of the journey, one row per
# fact, each quoted verbatim from an indexed official source. Loaded by
# `python -m ingestion run --source rules` into the `rules` table; the loader rejects a row whose
# source is not indexed, whose quote is not in the source text, or whose value states a figure
# absent from the quote (CLAUDE.md, rule 6).
#
# Fields
#   id                 kebab-case, stable
#   permit             vls_ts_etudiant | cst_etudiant | csp_etudiant | rece | cst_salarie |
#                      csp_salarie | talent_salarie_qualifie | stage_etudiant |
#                      cr_etudiant | cr_salarie | cr_10_ans   (cr_* : Algerian certificates)
#   nationality_scope  all | algerian
#   topic              work_limit | resources | deadline | fee | duration | salary_threshold |
#                      residence_requirement | internship | documents
#   stage              journey stage
#   label              short statement of what the value is (fr, en)
#   value              the fact as stated in the source
#   quote              verbatim excerpt of the source containing the value
#   source             "{source_type}:{source_id}" of an indexed source
#   verified_by, verified_at   set by the maintainer; only verified rows are used by the agent

version: 1
rules:
  - id: student-work-hours
    permit: cst_etudiant
    nationality_scope: all
    topic: work_limit
    stage: working
    label: {fr: "Durée de travail maximale sans autorisation de travail", en: "Maximum working time without a work permit"}
    value: "964 heures par an maximum (60 % de la durée annuelle légale du travail)"
    quote: "L'étudiant peut travailler 964 heures par an maximum (60 % de la durée annuelle légale du travail) sans demander d’autorisation de travail."
    source: fact_sheet:F2713
    verified_by: null
    verified_at: null
