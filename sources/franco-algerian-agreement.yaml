title: >-
  Accord du 27 décembre 1968 entre le Gouvernement de la République française et le
  Gouvernement de la République algérienne démocratique et populaire relatif à la circulation,
  à l'emploi et au séjour en France des ressortissants algériens et de leurs familles, et son
  protocole annexe (texte consolidé)
short_title: Accord franco-algérien du 27 décembre 1968

