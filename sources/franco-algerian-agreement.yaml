          I. « l'article 6 » remplacé par « l'article 6 nouveau » (première phrase); II. « après
          le contrôle médical d'usage » inséré après « reçoivent » (a); III. « ministre chargé
          des travailleurs immigrés » remplacé par « ministre chargé de l'emploi » (b); IV. « de
          plein droit » inséré après « reçoivent » et « membre de famille » remplacé par « vie
          privée et familiale » (d); V. e, f et g ajoutés après le d.

  - id: article-7-bis
    part: accord
    label: Article 7 bis
    journey_stages: [settling]
    text: |-
      Les ressortissants algériens visés à l'article 7 peuvent obtenir un certificat de résidence de 10 ans s'ils justifient d'une résidence ininterrompue en France de 3 années.
      Il est statué sur leur demande en tenant compte des moyens d'existence dont ils peuvent faire état, parmi lesquels les conditions de leur activité professionnelle et, le cas échéant, des justifications qu'ils peuvent invoquer à l'appui de leur demande.
      Le certificat de résidence valable 10 ans, renouvelé automatiquement, confère à son titulaire le droit d'exercer en France la profession de son choix, dans le respect des dispositions régissant l'exercice des professions réglementées.
      Le certificat de résidence valable 10 ans est délivré de plein droit sous réserve de la régularité du séjour pour ce qui concerne les catégories visées au a, au b, au c, et au g :
      a) Au ressortissant algérien, marié depuis au moins un an avec un ressortissant de nationalité française, dans les mêmes conditions que celles prévues à l'article 6 nouveau 2, et au dernier alinéa de ce même article.
      b) A l'enfant algérien d'un ressortissant français si cet enfant a moins de 21 ans ou s'il est à la charge de ses parents, ainsi qu'aux ascendants d'un ressortissant français et de son conjoint qui sont à sa charge ;
      c) Au ressortissant algérien titulaire d'une rente d'accident du travail ou de maladie professionnelle servie par un organisme français et dont le taux d'incapacité permanente est égal ou supérieur à 20 % ainsi qu'aux ayants droit d'un ressortissant algérien, bénéficiaires d'une rente de décès pour accident de travail ou maladie professionnelle versée par un organisme français ;
      d) Aux membres de la famille d'un ressortissant algérien titulaire d'un certificat de résidence valable 10 ans qui sont autorisés à résider en France au titre du regroupement familial ;
      e) Au ressortissant algérien qui justifie résider habituellement en France depuis qu'il a atteint au plus l'âge de 10 ans ;
      f) Au ressortissant algérien qui est en situation régulière depuis plus de 10 ans, sauf s'il a été, pendant toute cette période, titulaire d'un certificat de résidence portant la mention « étudiant » ;
      g) Au ressortissant algérien ascendant direct d'un enfant français résidant en France, à la condition qu'il exerce, même partiellement, l'autorité parentale à l'égard de cet enfant ou qu'il subvienne effectivement à ses besoins, à l'échéance de son certificat de résidence d'un an ;
      h) Au ressortissant algérien titulaire d'un certificat de résidence d'une validité d'un an portant la mention « vie privée et familiale », lorsqu'il remplit les conditions prévues aux alinéas précédents ou, à défaut, lorsqu'il justifie de 5 années de résidence régulière ininterrompue en France.
      Les certificats de résidence valables 10 ans sont délivrés et renouvelés gratuitement.
    history:
      - {instrument: avenant-1985, provision: Article 3, change: inserted}
      - instrument: avenant-2001
        provision: Article 5, I à VI
        change: amended
