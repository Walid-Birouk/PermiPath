          I. « sous réserve de la régularité du séjour pour ce qui concerne les catégories visées
          au a, au b, au c, et au g » inséré après « est délivré de plein droit » (4e alinéa);
          II. a remplacé; III. « ou de maladie professionnelle » inséré après « d'une rente
          d'accident du travail » et fin du c complétée (ayants droit); IV. « au titre du
          regroupement familial » ajouté à la fin du d; V. f supprimé, nouveaux f, g et h;
          VI. dernier alinéa remplacé.

  - id: article-7-ter
    part: accord
    label: Article 7 ter
    journey_stages: [settling]
    text: |-
      Le ressortissant algérien, qui, après avoir résidé en France sous couvert d'un certificat de résidence valable 10 ans, a établi ou établit sa résidence habituelle hors de France et qui est titulaire d'une pension contributive de vieillesse, de droit propre ou de droit dérivé, liquidée au titre d'un régime de base français de sécurité sociale, bénéficie, à sa demande, d'un certificat de résidence valable 10 ans portant la mention « retraité ». Ce certificat lui permet d'entrer à tout moment sur le territoire français pour y effectuer des séjours n'excédant pas un an. Il est renouvelé de plein droit. Il n'ouvre pas droit à l'exercice d'une activité professionnelle.
      Le conjoint du titulaire d'un certificat de résidence portant la mention « retraité » ayant résidé régulièrement en France avec lui bénéficie d'un certificat de résidence conférant les mêmes droits et portant la mention « conjoint de retraité ».
      Le certificat de résidence portant la mention « retraité » est assimilé à la carte de séjour portant la mention « retraité » pour l'application de la législation française en vigueur tant en matière d'entrée et de séjour qu'en matière sociale.
    history:
      - {instrument: avenant-2001, provision: Article 6, change: inserted}

  - id: article-8
    part: accord
    label: Article 8
    journey_stages: [renewing, settling]
    text: |-
      Le certificat de résidence d'un ressortissant algérien qui aura quitté le territoire français pendant une période de plus de 3 ans consécutifs est périmé.
      Toutefois, il lui sera possible de demander la prolongation de la période visée au premier alinéa soit avant son départ de France, soit par l'intermédiaire des Ambassades ou Consultats français.
    history:
      - {instrument: accord-1968, change: original}
      - {instrument: avenant-1994, provision: Article 8 (nouveau), change: replaced}

  - id: article-9
    part: accord
    label: Article 9
    journey_stages: [arriving]
    text: |-
      Sans préjudice des stipulations du titre Ier du protocole annexé au présent Accord et de l'échange de lettres modifié du 31 août 1983, les ressortissants algériens venant en France pour un séjour inférieur à 3 mois doivent présenter un passeport en cours de validité muni d'un visa délivré par les autorités françaises.
      Pour être admis à entrer et séjourner plus de 3 mois sur le territoire français au titre des articles 4, 5, 7, 7 bis, alinéa 4 (lettres c et d), et du titre III du protocole, les ressortissants algériens doivent présenter un passeport en cours de validité muni d'un visa de long séjour délivré par les autorités françaises.
      Ce visa de long séjour accompagné de pièces et documents justificatifs permet d'obtenir un certificat de résidence dont la durée de validité est fixée par les articles et titre mentionnés à l'alinéa précédent.
    history:
      - {instrument: accord-1968, change: original}
      - {instrument: avenant-1994, provision: Article 9 (nouveau), change: replaced}
      - instrument: avenant-2001
        provision: Article 7
        change: amended
        detail: 2e alinéa, « (lettres a à d) » remplacé par « (lettres c et d) ».

  - id: article-10
    part: accord
    label: Article 10
    text: |-
      Les mineurs algériens de 18 ans résidant en France, qui ne sont pas titulaires d'un certificat de résidence reçoivent sur leur demande un document de circulation pour étrangers mineurs qui tient lieu de visa lorsqu'ils relèvent de l'une des catégories mentionnées ci-après:
      a) Le mineur algérien dont l'un au moins des parents est titulaire du certificat de résidence de 10 ans ou du certificat de résidence d'un an et qui a été autorisé à séjourner en France au titre du regroupement familial;
      b) Le mineur algérien qui justifie par tous moyens avoir sa résidence habituelle en France depuis qu'il a atteint au plus l'âge de 10 ans et pendant une durée d'au moins de 6 ans;
      c) Le mineur algérien entré en France pour y suivre des études sous couvert d'un visa d'une durée supérieure à 3 mois;
      d) Le mineur algérien né en France dont l'un au moins des parents réside régulièrement en France.
    history:
      - {instrument: accord-1968, change: original}
      - {instrument: avenant-1985, provision: Article 3, change: replaced}
      - {instrument: avenant-1994, provision: Article 10 (nouveau), change: replaced}

  - id: article-11
    part: accord
    label: Article 11
    text: |-
      Le présent accord entrera en vigueur à la date de sa signature.
      Les dispositions des articles 1er, 2, 9 et 10 prendront effet à compter du 1er janvier 1969.
      L'application des dispositions concernant la délivrance des certificats de résidence s'échelonnera sur une période d'une année à compter du 1er janvier 1969.
    history:
      - {instrument: accord-1968, change: original}

  - id: article-12
    part: accord
    label: Article 12
    text: |-
      Une commission mixte est chargée de suivre l'application du présent Accord et d'examiner, dans le but d'y apporter des solutions satisfaisantes, les difficultés qui viendraient à surgir.
      La désignation des membres de cette commission est faite par chacun des deux gouvernements.
      Cette commission se réunit en tant que de besoin à la demande d'une des parties contractantes alternativement en Algérie et en France.
    history:
      - {instrument: accord-1968, change: original}
      - instrument: avenant-1985
        provision: Article 4
        change: amended
        detail: 3e alinéa, « annuellement » substitué à « semestriellement ».
      - {instrument: avenant-1994, provision: Article 12 (nouveau), change: replaced}

  - id: annexe
    part: accord
    label: Annexe (critères de santé)
    status: repealed
    history:
      - {instrument: accord-1968, change: original}
      - {instrument: avenant-2001, provision: Article 8, change: repealed}

  # --- Protocole (protocol of the first amendment, which replaced the 1968 protocol) ------
  - id: protocole-titre-1
    part: protocole
    label: Titre I. Circulation des personnes
    journey_stages: [renewing, settling]
    text: |-
      Sont admis à circuler librement entre l'Algérie et la France, sans discrimination aucune et sur simple présentation d'un document de voyage en cours de validité, les titulaires du certificat de résidence en cours de validité.
    history:
      - {instrument: avenant-1985, provision: Article 5 (Protocole), change: replaced}
      - instrument: avenant-2001
        provision: Article 9
        change: amended
        detail: « de la carte nationale d'identité » remplacé par « d'un document de voyage en cours de validité ».

  - id: protocole-titre-2
    part: protocole
    label: Titre II. Départ des familles
    journey_stages: [settling]
    text: |-
      Les membres de la famille s'entendent du conjoint d'un ressortissant algérien, de ses enfants mineurs ainsi que des enfants de moins de 18 ans dont il a juridiquement la charge en vertu d'une décision de l'autorité judiciaire algérienne, dans l'intérêt supérieur de l'enfant.
      Le cas des ascendants du travailleur désireux de résider en France fera l'objet d'un examen particulier.
    history:
      - {instrument: avenant-1985, provision: Article 5 (Protocole), change: replaced}
      - instrument: avenant-2001
        provision: Article 10
        change: amended
        detail: « , dans l'intérêt supérieur de l'enfant » ajouté à la fin du premier alinéa.

  - id: protocole-titre-3
    part: protocole
    label: >-
      Titre III. Etablissement des étudiants, stagiaires, fonctionnaires et agents des organismes
      algériens, des travailleurs saisonniers, des malades
    journey_stages: [arriving, renewing, working]
    text: |-
      Les ressortissants algériens qui suivent un enseignement, un stage ou font des études en France et justifient de moyens d'existence suffisants (bourse ou autres ressources) reçoivent, sur présentation, soit d'une attestation de préinscription ou d'inscription dans un établissement d'enseignement français, soit d'une attestation de stage, un certificat de résidence valable un an, renouvelable et portant la mention « étudiant » ou « stagiaire ».
      Les ressortissants algériens titulaires d'un certificat de résidence portant la mention « étudiant », sous réserve de leur inscription dans un établissement ouvrant droit au régime de sécurité sociale des étudiants, peuvent être autorisés à travailler dans la limite d'un mi-temps annuel pour la branche ou la profession concernée. L'autorisation est délivrée sous forme d'autorisation provisoire de travail sur présentation d'une promesse d'embauche ou d'un contrat de travail.
      Les fonctionnaires ou agents des organismes algériens reçoivent, sur présentation d'une attestation délivrée par l'autorité algérienne compétente, un certificat de résidence valable 2 ans, renouvelable et portant la mention « agent officiel ».
      Les travailleurs saisonniers reçoivent, sur présentation d'un contrat de travail qui est visé par les services du ministre chargé de l'emploi et dont la durée n'atteint pas une année, un certificat de résidence valable pour la durée du contrat portant la mention « travailleur temporaire » conformément à l'article 7 e de l'accord.
      Les ressortissants algériens admis dans des établissements de soins français et n'ayant pas leur résidence habituelle en France peuvent se voir délivrer par l'autorité française compétente, après examen de leur situation médicale, une autorisation provisoire de séjour, renouvelable le cas échéant.
    history:
      - {instrument: avenant-1985, provision: Article 5 (Protocole), change: replaced}
      - instrument: avenant-2001
        provision: Article 11, I à III
        change: amended
        detail: >-
          I. nouvel alinéa (travail des étudiants) après le premier; II. 4e alinéa:
          « ministre chargé des travailleurs immigrés » remplacé par « ministre chargé de
          l'emploi », mention « travailleur temporaire » ajoutée; III. les deux derniers alinéas
          (contrat de travail visé; malades) remplacés par un alinéa.

  - id: protocole-titre-4
    part: protocole
    label: Titre IV
    journey_stages: [arriving]
    text: |-
      Les ressortissants algériens résidant en France doivent être titulaires d'un certificat de résidence à partir de l'âge de 18 ans.
      Les ressortissants algériens âgés de 16 à 18 ans qui déclarent vouloir exercer une activité professionnelle salariée reçoivent de plein droit un certificat de résidence:
      - d'une durée de validité d'un an, lorsqu'ils ont été autorisés à séjourner en France au titre du regroupement familial et que l'un au moins de leurs parents est titulaire d'un certificat de résidence de même durée;
      - d'une durée de validité de 10 ans lorsqu'ils remplissent les conditions prévues à l'article 7 bis, 4e alinéa.
      Ils peuvent, dans les autres cas, solliciter un certificat de résidence valable un an.
    history:
      - {instrument: avenant-1985, provision: Article 5 (Protocole), change: replaced}
      - {instrument: avenant-1994, provision: Titre IV du Protocole (nouveau), change: replaced}

not_consolidated:
  - Échange de lettres du 27 décembre 1968 (lettres I à IV), on the quota of article 1 and the repatriations of article 10, both since repealed or replaced.
  - Échange de lettres du 22 décembre 1985, on early issue of the ten-year certificate under article 6 of the first amendment, repealed in 1994.
  - Échange de lettres du 11 juillet 2001 (consultation on long-stay visa procedures in the mixed commission); not an amendment of the Accord.
  - Échange de lettres modifié du 31 août 1983, cited by article 9; a separate instrument.

editorial_notes:
  - Third amendment (Légifrance text) omits the closing quotation mark of every quoted permit mention (e.g. « "vie privée et familiale est délivré »). Closing marks are restored in articles 6, 7 (d to g), 7 bis (f, h), 7 ter and Protocol title III; mentions are written « … ».
  - Article 7, "a) les ressortissants" (lower case) and the colon closing the first alinéa are as printed in the JO of 8 March 1986.
  - Article 8 "Consultats français", article 10 "Les mineurs algériens de 18 ans" and "d'au moins de 6 ans" are as printed in the JO of 20 December 1994 (sic), not Légifrance errors.
  - Article 7 a) and article 7 bis c), the 2001 insertions are made without added punctuation, as worded in the amendment.
  - Preamble, "Évian" is written with the accent; the JO of 22 March 1969 prints unaccented capitals ("Evian").
  - Figures are written in digits (e.g. "10 ans", "21 ans", "3 mois", "20 %" for "20 p. 100"), as a maintainer convention; the official texts spell most of them out. "un an" and "une année" stay in words.
  - The UN Treaty Series reprint differs in typography from the JO (figures in digits, "20 %", capital A) to D) in article 7, some commas); the JO wording is used.
