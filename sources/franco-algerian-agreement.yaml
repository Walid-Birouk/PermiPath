# Consolidated text of the Franco-Algerian agreement of 27 December 1968 and its Protocol,
# rebuilt from the official texts of the agreement and its three amendments (CLAUDE.md,
# Sources #4). Read by `ingestion.consolidation`; indexed only once `status` is `verified`.
#
# Conventions
# - One entry per provision (article of the Accord, title of the Protocol). Each alinéa is one
#   line of `text`.
# - Wording is reproduced from the source named in `transcribed_from` of the instrument that
#   last set it. Amended passages are built only from the words quoted in the amending
#   instrument; each change is listed in `history`.
# - Wording and typography follow the Journal officiel, except that figures are written in
#   digits (see `editorial_notes`). Missing closing quotation marks in the
#   Légifrance text of the third amendment are restored; see `editorial_notes`.
# - Provisions repealed and not replaced have `status: repealed` and no text.

