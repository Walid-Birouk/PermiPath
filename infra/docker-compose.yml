# Local development stack. Run from the repository root: `docker compose up`.
name: permipath

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: permipath
      POSTGRES_PASSWORD: permipath
      POSTGRES_DB: permipath
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init.sql:/docker-entrypoint-initdb.d/10-db-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permipath -d permipath"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/backend.Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql://permipath:permipath@db:5432/permipath
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/frontend.Dockerfile
    environment:
      API_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
